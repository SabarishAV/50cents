# Keep Gradle memory small: this machine has ~6 GB RAM, and the Flutter tool
# crashed while creating a Dart worker thread when Gradle/Kotlin reserved too much.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Do not keep a multi-hundred-MB Gradle daemon alive after the build.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false
# Compile Kotlin inside Gradle instead of spawning a second JVM (default is -Xmx8G).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation to avoid incremental cache corruption
# caused by path mismatch between pub cache (C:) and project (E:)
kotlin.incremental=false
