# The line below is required for the 'package_names' lint to be ignored.
# ignore: package_names
name: _50cents
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  google_sign_in: ^7.2.0
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  dart_husky: ^1.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/google_logo.png
    - assets/icon/app_icon_v1.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon_v1.png"
  remove_alpha_ios: true