name: Release APK

# Push a version tag (for example `v1.2.3`) to build a signed APK and publish
# it as a downloadable asset on the GitHub Release for that tag.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "ndk;28.2.13676358"

      # The keystore and key.properties are gitignored, so restore them from
      # repository secrets at build time.
      - name: Restore release signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS)." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/50cents.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=50cents.jks
          EOF

      # .env is gitignored but declared as a Flutter asset in pubspec.yaml, so
      # its values are baked into the APK. Use production secrets, never the
      # placeholders from .env.example.
      - name: Create production .env
        shell: bash
        env:
          API_URL: ${{ secrets.ENV_API_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.ENV_GOOGLE_SERVER_CLIENT_ID }}
          REDIRECT_PAGE_URL: ${{ secrets.ENV_REDIRECT_PAGE_URL }}
          REDIRECT_EXPIRY_MINUTES: ${{ secrets.ENV_REDIRECT_EXPIRY_MINUTES }}
        run: |
          for key in API_URL GOOGLE_SERVER_CLIENT_ID REDIRECT_PAGE_URL REDIRECT_EXPIRY_MINUTES; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing release env secret ENV_$key" >&2
              exit 1
            fi
          done
          {
            echo "API_URL=$API_URL"
            echo "GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
            echo "REDIRECT_PAGE_URL=$REDIRECT_PAGE_URL"
            echo "REDIRECT_EXPIRY_MINUTES=$REDIRECT_EXPIRY_MINUTES"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME}"
          VERSION="${RAW#[vV]}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$RAW' is not a version tag. Use vX.Y.Z, e.g. v1.2.3." >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( 10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        shell: bash
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      # The Gradle `copyReleaseApk` finalizer produces build/app/outputs/flutter-apk/50cents.apk.
      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/50cents.apk"
          test -f "$APK" || { echo "::error::Missing $APK" >&2; exit 1; }
          ls -lh "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 50cents ${{ steps.version.outputs.name }}
          files: build/app/outputs/flutter-apk/50cents.apk
          generate_release_notes: true
