name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # .env is gitignored, but it is declared as an asset in pubspec.yaml.
      # Create one from the committed example so asset checks and analysis pass.
      - name: Create .env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (check only, no writes)
        run: dart format -o none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings